version: '3.8'

services:
  # =============================================================================
  # PostgreSQL 16 Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: smart-supply-chain-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supply_chain_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supply_chain_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - supply-chain-network

  # =============================================================================
  # Redis 7 In-Memory Cache & BullMQ Store
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: smart-supply-chain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - supply-chain-network

  # =============================================================================
  # Python FastAPI AI Demand Forecasting Microservice
  # =============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smart-supply-chain-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - supply-chain-network

  # =============================================================================
  # Node.js Express REST API Main Backend
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-supply-chain-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/supply_chain_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: supersecret_supply_chain_jwt_key_2026
      JWT_REFRESH_SECRET: supersecret_supply_chain_refresh_jwt_key_2026
      FRONTEND_URL: http://localhost:3000
    command: >
      sh -c "npx prisma migrate deploy && node server.js"
    networks:
      - supply-chain-network

  # =============================================================================
  # React 19 Frontend (Served via Nginx)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    container_name: smart-supply-chain-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - supply-chain-network

networks:
  supply-chain-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
